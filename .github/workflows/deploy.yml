name: Test and deploy

on:
  workflow_dispatch:
    inputs:
      include_static_assets:
        description: Re-deploy images, videos, and other static files
        type: boolean
        required: true
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  deploy:
    needs: test
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: vfswiss-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect static media changes
        id: assets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INCLUDE_STATIC_INPUT: ${{ inputs.include_static_assets }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            include_static="$INCLUDE_STATIC_INPUT"
          elif [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- web/static/img; then
              include_static=false
            else
              include_static=true
            fi
          else
            include_static=true
          fi
          echo "include_static=$include_static" >> "$GITHUB_OUTPUT"

      - name: Build Linux release archive
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: linux
          INCLUDE_STATIC: ${{ steps.assets.outputs.include_static }}
        run: |
          mkdir -p dist/package/web/static
          go build -trimpath -ldflags="-s -w" -o dist/package/vfswiss ./cmd/server
          cp -R web/templates dist/package/web/
          cp -R web/static/css web/static/js dist/package/web/static/
          cp web/static/yandex_e27940cec41102c4.html dist/package/web/static/
          if [[ "$INCLUDE_STATIC" == "true" ]]; then
            cp -R web/static/img dist/package/web/static/
            tar -czf dist/release.tar.gz -C dist/package vfswiss web/templates web/static/css web/static/js web/static/img web/static/yandex_e27940cec41102c4.html
            echo "Static media included in release."
          else
            tar -czf dist/release.tar.gz -C dist/package vfswiss web/templates web/static/css web/static/js web/static/yandex_e27940cec41102c4.html
            echo "Images and videos unchanged; skipping static media."
          fi
          ls -lh dist/release.tar.gz

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/vfswiss_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/vfswiss_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          scp -i "$HOME/.ssh/vfswiss_deploy" \
            -P "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            dist/release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/lib/vfswiss-deploy/incoming/release.tar.gz"

      - name: Install release and restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          ssh -i "$HOME/.ssh/vfswiss_deploy" \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/vfswiss-deploy"

      - name: Check production health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://vf-swiss.ru/health
          curl --fail --silent --show-error https://vf-swiss.ru/
